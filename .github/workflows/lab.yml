name: lab
# Battle-mechanics lab (models/lab): runs when models/lab/run.json changes. Fast loop: no other tests.
# Results → release `lab` (lab-results.json, lab-log.txt).
on:
  push:
    paths: ['models/lab/run.json']
permissions:
  contents: write
concurrency:
  group: lab
  cancel-in-progress: false
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 'kernel/package-lock.json
            models/package-lock.json' }
      - run: (cd kernel && npm ci --no-audit --no-fund) && (cd models && npm ci --no-audit --no-fund)
      - name: Lab
        working-directory: models
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node lab/run.mjs lab/run.json lab-results.json 2> lab-log.txt || { echo "::error title=lab::$(tail -c 1500 lab-log.txt | tr '\n' ' ')"; exit 1; }
          while read -r l; do echo "::notice title=lab::$l"; done < lab-log.txt
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view lab >/dev/null 2>&1 || gh release create lab --prerelease --title "Battle lab" --notes "Outputs of .github/workflows/lab.yml. Safe to delete."
          for f in models/lab-results.json models/lab-log.txt; do [ -f "$f" ] && gh release upload lab "$f" --clobber; done
