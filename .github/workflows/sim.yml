name: sim
# Headless playthroughs on several RNG seeds: seeds 0-2 play power-on -> Erika with code moves on (the stand-in
# model writes every move: sim/rehearse.py --mock); seeds 3-5 play power-on -> Misty on plain FireRed (sim/run.py).
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
  push:
    paths: [sim/**, patches/**, core/**, .github/workflows/sim.yml]
permissions:
  contents: read
jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        seed: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev
      - name: Cache pinned decomp compiler
        uses: actions/cache@v4
        with:
          path: .cache/agbcc
          key: agbcc-${{ hashFiles('upstream.lock.json') }}
      - name: Base ROM from the decomp (the code brain needs build/rom/rom.json, made from it)
        if: matrix.seed < 3
        run: |
          python3 scripts/dev.py setup
          python3 scripts/dev.py baseline   # before build: baseline needs the clean checkout
          mkdir -p local && cp build/baseline.gba local/baserom.gba
      - name: Build ROM (pinned decomp + patches)
        run: python3 scripts/dev.py setup && python3 scripts/dev.py build
      - name: Build simulator core (native)
        run: sim/build_core.sh
      - name: Play to Erika with code moves (the stand-in model)
        if: matrix.seed < 3
        run: |
          make deps                                  # the page's own battle brain runs in Node (sim/brain.ts)
          python3 scripts/rom_bundle.py              # build/rom/rom.json: the RAM symbols the brain reads
          pip install --break-system-packages pillow
          set +e
          mkdir -p build/sim
          CODERED_RUN=seed${{ matrix.seed }} python3 sim/rehearse.py --mock --seed ${{ matrix.seed }} --to erika --out build/sim/rehearsal > build/sim/out.txt 2>&1
          status=$?
          grep -v '^ ' build/sim/out.txt | grep -v '^[{}]' | head -40
          python3 sim/results.py --file build/sim/rehearsal/summary.json | sed 's/^/::notice title=seed ${{ matrix.seed }}::/' || true
          [ $status -ne 0 ] && echo "::error title=seed ${{ matrix.seed }}::$(grep -v '^ ' build/sim/out.txt | grep -v '^[{}]' | tail -c 1500 | tr '\n' '|')"
          exit $status
      - name: Play to Misty on plain FireRed
        if: matrix.seed >= 3
        run: |
          pip install --break-system-packages pillow
          set +e
          mkdir -p build/sim
          CODERED_RUN=seed${{ matrix.seed }} python3 sim/run.py misty --seed ${{ matrix.seed }} > build/sim/out.txt 2>&1
          status=$?
          cat build/sim/out.txt
          tail -n 12 build/sim/out.txt | tr '\n' '|' | sed 's/^/::warning title=log tail::/'; echo
          python3 - <<'PY'
          import json, glob
          files = glob.glob('build/sim/results/misty-seed*.json')
          if not files: raise SystemExit(0)
          r = json.load(open(files[0]))
          ok = r.get('ok')
          msg = (f"badges={r.get('badges')} game_min={r.get('game_minutes')} wall_s={r.get('wall_seconds')} speedup={r.get('speedup')}x party={r.get('party')}"
                 if ok else f"FAILED {r.get('error')} at {r.get('map')} frame {r.get('frame')}")
          print(f"::{'notice' if ok else 'error'} title=seed ${{ matrix.seed }}::{msg}")
          PY
          exit $status
      - name: Code moves (both sides; no host / hit / miss / mixed)
        if: matrix.seed == 0 && !cancelled()  # even when the Misty route flaked
        run: python3 sim/experiments/code_moves.py --starter BULBASAUR | python3 -c "import json,sys; r=json.load(sys.stdin); print(json.dumps(r['checks'], indent=1)); sys.exit(0 if all(r['checks'].values()) else 1)"
      - name: PokÉEG screen (bedroom PC; no host, mock host, note edit round trip)
        if: matrix.seed == 0 && !cancelled()  # even when the Misty route flaked
        run: python3 sim/experiments/pokeeg.py
      - name: Payload moves (ERROR's growl plays, FLASH's starburst animates, the battle goes on)
        if: matrix.seed == 0 && !cancelled()  # even when the Misty route flaked
        run: python3 sim/experiments/payload.py
      - name: Payload sounds on the GBA sound engine (8 kHz, the whole sample, each of the four)
        if: matrix.seed == 0 && !cancelled()
        run: for m in growl trill whine lullaby; do python3 sim/experiments/payload_audio.py $m || exit 1; done
      - name: Doubt (GROWL over SCRATCH is doubted 50% / 25% / 0% at 0 / 4 / 8 badges)
        if: matrix.seed == 0 && !cancelled()  # even when the Misty route flaked
        run: python3 sim/experiments/doubt.py 60
