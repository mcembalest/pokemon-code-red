name: core
# Builds the ROM-agnostic EmulatorJS mGBA core from pinned sources.
on:
  workflow_dispatch:
    inputs:
  push:
    paths: [core/**, '!core/release.json', .github/workflows/core.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Install pinned emsdk
        run: |
          EMSDK_REV=$(python3 -c "import json;print(json.load(open('core/sources.lock.json'))['emsdk']['revision'])")
          SDK=$(python3 -c "import json;print(json.load(open('core/sources.lock.json'))['emsdk']['sdk'])")
          git init -q "$RUNNER_TEMP/emsdk" && cd "$RUNNER_TEMP/emsdk"
          git fetch -q --depth=1 https://github.com/emscripten-core/emsdk.git "$EMSDK_REV" && git checkout -q FETCH_HEAD
          ./emsdk install "$SDK" && ./emsdk activate "$SDK"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"
      - name: Build core
        run: |
          source "$EMSDK/emsdk_env.sh"
          core/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: code-red-core
          path: build/core/
      - name: Release (tag core-<content version>, immutable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="core-$(core/version.sh)"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already published"; exit 0; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "Code Red core $TAG" \
            --notes "ROM-agnostic EmulatorJS mGBA core (ABI 1), built by .github/workflows/core.yml from core/ at $GITHUB_SHA. Pin in core/release.json."
          gh release upload "$TAG" build/core/code-red-mgba-wasm.data build/core/code-red-mgba-legacy-wasm.data build/core/SHA256SUMS
