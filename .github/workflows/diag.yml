name: diag
# One-off: does the live Worker's Qwen route keep numbers when streaming vs not? (as a throwaway ci-smoke session)
on:
  push:
    branches-ignore: [main]
    paths: ['diag/stream.json']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      URL: https://code-red-api.macembalest.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          cd worker && npm ci --no-audit --no-fund >/dev/null
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="code-red") | .uuid'); sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          TOKEN=$(openssl rand -hex 24); HASH=$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1); NOW=$(date +%s000)
          npx wrangler d1 execute code-red --remote --command "INSERT INTO sessions (token_hash, player_id, created_at, user_agent) VALUES ('$HASH', 'ci-smoke', $NOW, 'diag')" >/dev/null
          cd ..
          for M in @cf/qwen/qwen2.5-coder-32b-instruct @cf/meta/llama-3.2-3b-instruct; do
            B='{"model":"'$M'","messages":[{"role":"user","content":"Reply with exactly this line and nothing else: let p=0;for(let i=0;i<3199;i++){o.push(128+75*0.25)}"}],"max_tokens":80,"temperature":0}'
            curl -sS -X POST "$URL/v1/ai/chat/completions" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "$B" > "plain-${M##*/}.json"
            curl -sS -N -D "headers-${M##*/}.txt" -X POST "$URL/v1/ai/chat/completions" -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "${B%\}},\"stream\":true}" > "stream-${M##*/}.txt"
          done
          cd worker && npx wrangler d1 execute code-red --remote --command "DELETE FROM sessions WHERE token_hash = '$HASH'" >/dev/null; cd ..
          for f in plain-*.json; do echo "::notice title=$f::$(jq -c '.choices[0].message.content' $f)"; done
          gh release view diag >/dev/null 2>&1 || gh release create diag --prerelease --title "Diagnostics" --notes "One-off diagnostics. Safe to delete."
          gh release upload diag plain-*.json stream-*.txt headers-*.txt --clobber
