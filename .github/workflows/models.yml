name: models
# Probe Workers AI models on the starter moves (models/). Runs when models/probe.json changes.
on:
  push:
    paths: ['models/**', '.github/workflows/models.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests (sandbox scoring)
        working-directory: models
        run: npm ci && npm test
      - name: Probe
        id: probe
        working-directory: models
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git diff --name-only HEAD~1 HEAD | grep -qx 'models/probe.json' || { echo "probe.json unchanged; skipping"; exit 0; }
          echo "ran=1" >> "$GITHUB_OUTPUT"
          set -o pipefail
          node probe.mjs probe.json > probe-results.json 2> probe-log.txt || { echo "::error title=probe::$(tail -c 1500 probe-log.txt | tr '\n' ' ')"; exit 1; }
          while read -r l; do echo "::notice title=probe::$l"; done < probe-log.txt
      - name: Publish results
        if: always() && steps.probe.outputs.ran
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view model-probe >/dev/null 2>&1 || gh release create model-probe --prerelease --title "Workers AI model probe" --notes "Outputs of .github/workflows/models.yml. Safe to delete."
          for f in models/probe-results.json models/probe-log.txt; do [ -f "$f" ] && gh release upload model-probe "$f" --clobber; done
