name: models
# Workers AI experiments on the starter moves (models/, on the pi kernel in kernel/).
# Each experiment runs only when its config changes: probe.json, scaffold.json, kernel-exp.json, battle/exp.json.
on:
  push:
    paths: ['models/**', 'kernel/**', '.github/workflows/models.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests (kernel)
        working-directory: kernel
        run: npm ci && npm test
      - name: Kernel in the browser (Chromium)
        working-directory: kernel
        run: |
          pip install --quiet playwright==1.* && python3 -m playwright install --with-deps chromium >/dev/null
          node build.mjs && python3 test/browser_smoke.py | tail -1
      - name: Tests (sandbox scoring)
        working-directory: models
        run: npm ci && npm test
      - name: Probe
        id: probe
        working-directory: models
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git diff --name-only HEAD~1 HEAD | grep -qx 'models/probe.json' || { echo "probe.json unchanged; skipping"; exit 0; }
          echo "ran=1" >> "$GITHUB_OUTPUT"
          set -o pipefail
          node probe.mjs probe.json > probe-results.json 2> probe-log.txt || { echo "::error title=probe::$(tail -c 1500 probe-log.txt | tr '\n' ' ')"; exit 1; }
          while read -r l; do echo "::notice title=probe::$l"; done < probe-log.txt
      - name: Scaffold experiment
        id: scaffold
        working-directory: models
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git diff --name-only HEAD~1 HEAD | grep -qx 'models/scaffold.json' || { echo "scaffold.json unchanged; skipping"; exit 0; }
          echo "ran=1" >> "$GITHUB_OUTPUT"
          set -o pipefail
          node scaffold.mjs scaffold.json > scaffold-results.json 2> scaffold-log.txt || { echo "::error title=scaffold::$(tail -c 1500 scaffold-log.txt | tr '\n' ' ')"; exit 1; }
          while read -r l; do echo "::notice title=scaffold::$l"; done < scaffold-log.txt
      - name: Kernel experiment
        id: kernel
        working-directory: models
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git diff --name-only HEAD~1 HEAD | grep -qx 'models/kernel-exp.json' || { echo "kernel-exp.json unchanged; skipping"; exit 0; }
          echo "ran=1" >> "$GITHUB_OUTPUT"
          set -o pipefail
          node kernel-exp.mjs kernel-exp.json kernel-results.json 2> kernel-log.txt || { echo "::error title=kernel::$(tail -c 1500 kernel-log.txt | tr '\n' ' ')"; exit 1; }
          while read -r l; do echo "::notice title=kernel::$l"; done < kernel-log.txt
      - name: Battle rule experiment
        id: battle
        working-directory: models
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git diff --name-only HEAD~1 HEAD | grep -qx 'models/battle/exp.json' || { echo "battle/exp.json unchanged; skipping"; exit 0; }
          echo "ran=1" >> "$GITHUB_OUTPUT"
          node battle/exp.mjs battle/exp.json battle-results.json 2> battle-log.txt || { echo "::error title=battle::$(tail -c 1500 battle-log.txt | tr '\n' ' ')"; exit 1; }
          while read -r l; do echo "::notice title=battle::$l"; done < battle-log.txt
      - name: Publish results
        if: always() && (steps.probe.outputs.ran || steps.scaffold.outputs.ran || steps.kernel.outputs.ran || steps.battle.outputs.ran)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view model-probe >/dev/null 2>&1 || gh release create model-probe --prerelease --title "Workers AI model probe" --notes "Outputs of .github/workflows/models.yml. Safe to delete."
          for f in models/probe-results.json models/probe-log.txt models/scaffold-results.json models/scaffold-log.txt models/kernel-results.json models/kernel-log.txt models/battle-results.json models/battle-log.txt; do [ -f "$f" ] && gh release upload model-probe "$f" --clobber; done
