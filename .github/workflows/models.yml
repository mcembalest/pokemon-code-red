name: models
# Workers AI experiments on the starter moves (models/, on the pi kernel in kernel/).
# The rune experiment runs only when models/runes-exp.json changes; the kernel and rules tests run on every push.
on:
  push:
    paths: ['models/**', 'kernel/**', 'rules/**', '.github/workflows/models.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests (kernel)
        working-directory: kernel
        run: npm ci && npm test
      - name: Kernel in the browser (Chromium)
        working-directory: kernel
        run: |
          pip install --quiet playwright==1.* && python3 -m playwright install --with-deps chromium >/dev/null
          node build.mjs && python3 test/browser_smoke.py | tail -1
      - name: Model lab dependencies
        working-directory: models
        run: npm ci
      - name: Battle rules (shared by the game and the lab)
        run: node --test rules/test/*.test.mjs
      - name: Rune experiment (the emitter moves of rules/runes.mjs)
        id: runes
        working-directory: models
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          git diff --name-only HEAD~1 HEAD | grep -qx 'models/runes-exp.json' || { echo "runes-exp.json unchanged; skipping"; exit 0; }
          echo "ran=1" >> "$GITHUB_OUTPUT"
          node runes-exp.mjs runes-exp.json runes-results.json 2> runes-log.txt || { echo "::error title=runes::$(tail -c 1500 runes-log.txt | tr '\n' ' ')"; exit 1; }
          while read -r l; do echo "::notice title=runes::$l"; done < runes-log.txt
      - name: Publish results
        if: always() && steps.runes.outputs.ran
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view model-probe >/dev/null 2>&1 || gh release create model-probe --prerelease --title "Workers AI model probe" --notes "Outputs of .github/workflows/models.yml. Safe to delete."
          for f in models/runes-results.json models/runes-log.txt; do [ -f "$f" ] && gh release upload model-probe "$f" --clobber; done
