name: ci
# Full loop on every push: build base + Code Red ROMs from pinned decomp source,
# make the player bundle, run unit / native / browser tests. On main, publish
# the player bundle (no ROM bytes) as release player-<rom>-<commit>.
on:
  push:
    paths-ignore: ['notes/**', '**/*.md', 'worker/**', '.github/workflows/worker.yml', 'models/**', '.github/workflows/models.yml']
  pull_request:
    paths-ignore: ['notes/**', '**/*.md', 'worker/**', '.github/workflows/worker.yml', 'models/**', '.github/workflows/models.yml']
permissions:
  contents: write
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev libmgba-dev
      - name: Cache pinned decomp + compiler
        uses: actions/cache@v4
        with:
          path: .cache/agbcc
          key: agbcc-${{ hashFiles('upstream.lock.json') }}
      - name: Setup (pinned sources, emulator packages, npm deps)
        run: make setup
      - name: Base ROM from source (must equal FireRed USA v1.0)
        run: |
          python3 scripts/dev.py baseline
          mkdir -p local && cp build/baseline.gba local/baserom.gba && cp build/baseline-rev1.gba local/baserom-rev1.gba
      - name: Code Red ROM + bundle
        run: make rom-bundle
      - name: Save layout guard (existing player saves must keep loading)
        run: python3 scripts/save_guard.py
      - name: Patches match their sources; move names match the rules (CUSTOMIZING.md)
        run: python3 scripts/regen_patches.py --check && python3 scripts/move_names.py --check && python3 scripts/codespeak.py --check && python3 scripts/inventory.py --missing
      - name: Player
        run: make player
      - name: Unit tests
        run: make test
      - name: ROM tests (headless mGBA)
        run: |
          python3 scripts/smoke.py
          python3 tests/native/naming.py
      - name: Browser end-to-end (Chromium)
        run: |
          pip install --break-system-packages playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          python3 scripts/serve_player.py & sleep 1
          python3 player/tests/e2e.py --phase boot
          python3 player/tests/rev1.py
          (cd runner && npm test)
      - name: Invite gate + progress tracking (Chromium, mock backend)
        run: python3 player/tests/account.py
      - name: Cache simulator core
        uses: actions/cache@v4
        with:
          path: build/sim/mgba_libretro.so*
          key: simcore-${{ hashFiles('core/sources.lock.json', 'core/mgba.patch', 'core/adapter.inc', 'sim/build_core.sh') }}
      - name: Starter card + code moves + replay (sim states → Chromium, mock model)
        run: |
          sim/build_core.sh
          python3 sim/make_states.py
          python3 player/tests/agent_battle.py
      - name: PokÉEG (owned Pokémon from RAM, hot memory, recent code)
        run: python3 player/tests/pokeeg.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: build/e2e/*.png
      - name: Publish player bundle (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ROM=$(python3 -c "import json;print(json.load(open('build/rom/rom.json'))['rom_sha1'][:12])")
          TAG="player-$ROM-${GITHUB_SHA::7}"
          tar -C player/dist -czf code-red-player.tar.gz --exclude='*.map' .
          sha256sum code-red-player.tar.gz | tee code-red-player.tar.gz.sha256
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "Code Red player $TAG" \
            --notes "player/dist for ROM $ROM at $GITHUB_SHA. Contains no ROM bytes: players supply FireRed USA v1.0." \
            code-red-player.tar.gz code-red-player.tar.gz.sha256
      - name: Tell the site (pins the new bundle at once instead of on its next schedule)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}   # a fine-grained PAT for mcembalest/maxcembalest.com with Actions: write
        run: |
          if [ -z "$SITE_TOKEN" ]; then echo "::notice title=site::no SITE_TOKEN secret: the site pins on its own schedule (code-red-update.yml)"; exit 0; fi
          # the dispatch API itself (Actions: write is all it needs); the reply says why when GitHub refuses
          CODE=$(curl -sS -o site.out -w '%{http_code}' -X POST -H "Authorization: Bearer $SITE_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/mcembalest/maxcembalest.com/actions/workflows/code-red-update.yml/dispatches -d '{"ref":"main"}')
          if [ "$CODE" = 204 ]; then echo "::notice title=site::asked maxcembalest.com to pin the new bundle"
          else echo "::warning title=site::could not start the site's update workflow (HTTP $CODE: $(head -c 300 site.out | tr '\n' ' ')); it pins on its own schedule"; fi
