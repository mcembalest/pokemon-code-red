<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Private mailbox verification</title><style>body{margin:0}#game{width:100%;height:90vh;min-height:450px}</style><div id="game"></div>
<script>
window.EJS_player='#game'; window.EJS_core='gba'; window.EJS_gameUrl='/game.gba';
window.EJS_gameName='Code Red mailbox verification';window.EJS_startOnLoaded=true;
window.EJS_pathtodata='/emulator/';window.EJS_DEBUG_XX=true;window.EJS_disableDatabases=true;
window.EJS_core='mgba';window.EJS_forceLegacy=false;window.EJS_defaultOptions={'webgl2Enabled':'enabled','virtual-gamepad':'enabled','rewindEnabled':'enabled'};

window.EJS_onGameStart=async()=>{const {MailboxController}=await import('/bridge/browser-controller.js');window.controller=new MailboxController(EJS_emulator.gameManager.Module);window.ready=true;};
</script><script src="/emulator/loader.js"></script>
